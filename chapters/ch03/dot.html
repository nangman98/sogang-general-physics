<h1>내적 (scalar product)</h1>
<p>두 벡터의 <b class="k">내적 (scalar product)</b> <span data-tex="\vec a\cdot\vec b"></span>는 스칼라다. 한 벡터가 다른 벡터 방향으로 놓인 정도를 잰다.</p>
<div class="fig"><img src="fig/f3_dot.svg" alt="벡터 a와 b, 사이각 ϕ, b 방향으로의 a의 성분 a cos ϕ"></div>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec a\cdot\vec b = ab\cos\phi}"></div><span class="eq-no">(3.3.1)</span></div>
<div class="eq"><div class="eq-tex" data-tex="\vec a\cdot\vec b = (a\cos\phi)(b) \qquad \vec a\cdot\vec b = a_x b_x + a_y b_y + a_z b_z"></div><span class="eq-no">(3.3.2), (3.3.4)</span></div>
<ul class="pts">
<li><span data-tex="a\cos\phi"></span>는 <span data-tex="\vec b"></span> 방향으로의 <span data-tex="\vec a"></span>의 성분이다.</li>
<li><span data-tex="\phi = 90^\circ"></span>이면 0이고 <span data-tex="\phi > 90^\circ"></span>이면 음수다.</li>
<li>순서를 바꿔도 같다 (<span data-tex="\vec a\cdot\vec b = \vec b\cdot\vec a"></span>).</li>
</ul>
