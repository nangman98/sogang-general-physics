<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상대 운동 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="relative.html">← 상대 운동</a>
<h1>상대 운동 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec v_{PA} = \vec v_{PB} + \vec v_{BA}}"></div></div>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="img" aria-label="위에서 본 강을 건너는 모터보트와 속도 v_PB, v_BA, v_PA 화살표, 흐르는 강물과 양쪽 강가" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="PAval"></div><div class="read" id="timeval"></div><div class="read" id="driftval"></div></div></div>
<div class="bar">
<button id="play" aria-label="재생">▶</button><button id="reset" aria-label="처음으로">↺</button>
<label for="speed">배속 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<span class="read" id="tval"></span>
<label for="vPB">배의 속력 <span data-tex="v_{PB}"></span> <input type="range" id="vPB" min="2" max="6" step="0.5" value="3" style="width:120px"> <span class="read" id="vPBval"></span></label>
<label for="vBA">강물 속력 <span data-tex="v_{BA}"></span> <input type="range" id="vBA" min="0" max="3" step="0.5" value="1.5" style="width:120px"> <span class="read" id="vBAval"></span></label>
<label for="th">뱃머리 각 <input type="range" id="th" min="-60" max="60" step="1" value="0" style="width:120px"> <span class="read" id="thval"></span></label>
<label for="frame">기준틀 <select id="frame"><option value="A" selected>강가 A</option><option value="B">강물 B</option></select></label>
</div>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="boat.js"></script>
</body>
</html>
