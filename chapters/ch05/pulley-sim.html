<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도르래로 연결된 두 블록 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
</head>
<body>
<div class="page wide">
<a class="back" href="pulley.html">← 도르래로 연결된 두 블록</a>
<h1>도르래로 연결된 두 블록 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{a = \frac{m}{M + m}\,g}"></div><span class="eq-no"><span data-tex="g = 9.8\ \mathrm{m/s^2}"></span></span></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 900 470" role="img" aria-label="마찰 없는 탁자 위 블록 M과 도르래를 지나 매달린 블록 m, 장력 T와 중력 mg, 가속도 a" style="touch-action:none"></svg>
<div class="row">
<label for="M">탁자 위 블록 질량 <span data-tex="M"></span> <input type="range" id="M" min="0.5" max="5" step="0.1" value="3.3"> <span class="read" id="Mval"></span></label>
<label for="m">매달린 블록 질량 <span data-tex="m"></span> <input type="range" id="m" min="0.5" max="5" step="0.1" value="2.1"> <span class="read" id="mval"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
<p class="read" id="read"></p>
</div>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="pulley.js"></script>
</body>
</html>
