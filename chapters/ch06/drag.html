<h1>항력과 종단 속력 (drag force and terminal speed)</h1>
<div class="cols">
<div>
<p>공기 속을 움직이는 물체는 상대 운동을 막는 방향으로 <b class="k">항력 (drag force)</b> <span data-tex="D"></span>를 받는다. 크기는 <span data-tex="D = \tfrac12 C\rho A v^2"></span> (6.2.1)이고 <span data-tex="C"></span>는 실험으로 정하는 항력 계수다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{v_t = \sqrt{\dfrac{2F_g}{C\rho A}}}"></div><span class="eq-no">(6.2.3)</span></div>
<ul class="pts">
<li>떨어지는 동안 <span data-tex="D - F_g = ma"></span> (6.2.2)이고 속력이 커질수록 <span data-tex="D"></span>가 커져 가속도가 줄어든다.</li>
<li><span data-tex="D"></span>가 <span data-tex="F_g"></span>와 같아지면 더 빨라지지 않고 일정한 <b class="k">종단 속력 (terminal speed)</b> <span data-tex="v_t"></span>로 떨어진다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_drag.svg" alt="떨어지기 시작할 때, 조금 뒤, 종단 속력일 때 떨어지는 물체에 작용하는 항력 D와 중력 F_g, 속도 v"></div>
</div>
