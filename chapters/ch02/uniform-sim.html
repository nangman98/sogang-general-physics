<h1>등속도 운동 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{x = x_0 + vt}"></div></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 660 380" role="img" aria-label="x축 위를 움직이는 물체와 x-t 그래프"></svg>
<div class="row">
<label for="v">속도 <span data-tex="v"></span> <input type="range" id="v" min="-4" max="4" step="0.5" value="2"> <span class="read" id="vval"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
<p class="read" id="read"></p>
</div>
