<h1>일과 운동에너지 (work and kinetic energy)</h1>
<div class="cols">
<div>
<p><b class="k">운동에너지 (kinetic energy)</b>는 <span data-tex="K = \tfrac12 mv^2"></span> (7.1.1)이다. 일정한 힘 <span data-tex="F"></span>가 변위 <span data-tex="d"></span> 동안 하는 <b class="k">일 (work)</b>은 <span data-tex="W = Fd\cos\phi"></span> (7.2.5)이고 <span data-tex="\phi"></span>는 힘과 변위 사이의 각이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\Delta K = K_f - K_i = W}"></div><span class="eq-no">(7.2.8)</span></div>
<ul class="pts">
<li>변위 방향 성분만 일을 한다. <span data-tex="\phi = 90^\circ"></span>이면 일은 0이다.</li>
<li>물체로 들어간 에너지는 양의 일, 물체에서 나간 에너지는 음의 일이다 (<span data-tex="\phi > 90^\circ"></span>).</li>
<li>중력이 하는 일도 같은 꼴 <span data-tex="W_g = mgd\cos\phi"></span> (7.3.1)이다. 물체를 올리면 <span data-tex="-mgd"></span>, 내리면 <span data-tex="+mgd"></span>다 (7.3.2, 7.3.3).</li>
</ul>
</div>
<div class="fig"><img src="fig/f1_work.svg" alt="철사를 따라 변위 d만큼 움직이는 구슬에 각 ϕ로 작용하는 힘 F, 처음 속도 v0와 나중 속도 v, 운동에너지 K_i와 K_f"></div>
</div>
