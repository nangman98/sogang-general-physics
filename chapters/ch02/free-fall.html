<h1>자유 낙하 (free fall)</h1>
<p>공기를 무시하면 물체는 올라갈 때나 내려갈 때나 아래 방향으로 크기 <span data-tex="g"></span>인 일정한 가속도를 받는다. <span data-tex="y"></span>축을 위로 잡으면 <span data-tex="a = -g"></span>다.</p>

<div class="eq"><div class="eq-tex" data-tex="a = -g = -9.8\ \mathrm{m/s^2}"></div></div>
<div class="eq"><div class="eq-tex" data-tex="v = v_0 - gt"></div><span class="eq-no">(2.4.1에서 <span data-tex="a = -g"></span>)</span></div>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{y - y_0 = v_0 t - \tfrac{1}{2} g t^2}"></div><span class="eq-no">(2.4.5에서 <span data-tex="a = -g"></span>)</span></div>
<ul class="pts">
<li><span data-tex="v"></span>–<span data-tex="t"></span> 그래프는 기울기가 <span data-tex="-g"></span>인 직선이다.</li>
<li>가장 높은 곳에서 <span data-tex="v = 0"></span>이지만 가속도는 그대로 <span data-tex="-g"></span>다.</li>
<li><span data-tex="g"></span> 자체는 양수 9.8 m/s²다.</li>
</ul>

<div class="fig"><img src="fig/f6_free_fall.svg" alt="정지 상태에서 떨어지는 물체의 t = 0, 1, 2, 3 s 위치와 속도 화살표"></div>
