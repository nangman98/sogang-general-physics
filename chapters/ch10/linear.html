<h1>선변수와 각변수 (relating the linear and angular variables)</h1>
<div class="cols">
<div>
<p>회전축에서 거리 <span data-tex="r"></span>인 점은 반지름 <span data-tex="r"></span>인 원을 그린다. 원판이 <span data-tex="\theta"></span>만큼 돌면 그 점은 호 <span data-tex="s = \theta r"></span> (10.3.1)만큼 움직인다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{v = \omega r}"></div><span class="eq-no">(10.3.2)</span></div>
<ul class="pts">
<li>원판의 모든 점은 같은 시간에 같은 각만큼 돌아 <span data-tex="\omega"></span>가 같다. 그래서 선속력 <span data-tex="v"></span>는 <span data-tex="r"></span>에 비례한다.</li>
<li>가속도는 접선 성분 <span data-tex="a_t = \alpha r"></span> (10.3.6)과 지름 성분 <span data-tex="a_r = v^2/r = \omega^2 r"></span> (10.3.7)로 나뉜다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_linear_angular.svg" alt="각속도 ω로 도는 원판 위 반지름 r1, r2인 두 점과 접선 방향 속도 v1, v2"></div>
</div>
