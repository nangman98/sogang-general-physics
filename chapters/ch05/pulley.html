<h1>도르래로 연결된 두 블록 (block on table, block hanging)</h1>
<div class="cols">
<div>
<p>마찰 없는 탁자 위 블록(질량 <span data-tex="M"></span>)과 매달린 블록(질량 <span data-tex="m"></span>)이 줄로 이어져 있다. 줄과 도르래의 질량, 도르래의 마찰은 무시한다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{a = \frac{m}{M + m}\,g}"></div><span class="eq-no">(5.3.7)</span></div>
<ul class="pts">
<li>블록마다 제2법칙을 쓴다. 탁자 위 블록은 <span data-tex="T = Ma"></span> (5.3.4), 매달린 블록은 <span data-tex="T - mg = -ma"></span> (5.3.6)이고 두 식에서 <span data-tex="T"></span>를 지우면 위 식이 된다.</li>
<li><span data-tex="T = \dfrac{M}{M + m}\,mg"></span> (5.3.9)이므로 <span data-tex="T"></span>는 <span data-tex="mg"></span>보다 작고 <span data-tex="a"></span>는 <span data-tex="g"></span>보다 작다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f3_pulley.svg" alt="마찰 없는 탁자 위 블록 M과 도르래를 지나는 줄에 매달린 블록 m, 두 블록에 작용하는 장력 T와 중력 mg, 가속도 a"></div>
