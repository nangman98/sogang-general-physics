<h1>등가속도 운동 (constant acceleration)</h1>
<div class="cols">
<div>
<p><b class="k">속도 (velocity)</b>는 위치의 시간 변화율 <span data-tex="v = dx/dt"></span> (2.2.1)이고 <b class="k">가속도 (acceleration)</b>는 속도의 시간 변화율 <span data-tex="a = dv/dt"></span> (2.3.2)다. 가속도가 일정하면 위치는 다음과 같다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{x - x_0 = v_0 t + \tfrac{1}{2} a t^2}"></div><span class="eq-no">(2.4.5)</span></div>
<ul class="pts">
<li>속도는 <span data-tex="v = v_0 + at"></span>다 (2.4.1).</li>
<li><span data-tex="x"></span>–<span data-tex="t"></span> 그래프의 기울기가 <span data-tex="v"></span>이고 <span data-tex="v"></span>–<span data-tex="t"></span> 그래프의 기울기가 <span data-tex="a"></span>다.</li>
<li>속도와 가속도의 부호가 같으면 빨라지고 다르면 느려진다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f1_accel.svg" alt="일정한 가속도로 움직이는 물체의 x-t 포물선(접선의 기울기가 v), v-t 직선(기울기가 a), a-t 수평선"></div>
</div>
