<h1>1차원 충돌 (collisions in one dimension)</h1>
<div class="cols">
<div>
<p>닫힌 고립계에서는 충돌 전과 뒤의 선운동량 합이 같다. 정지한 물체 2에 물체 1이 부딪히는 경우를 본다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{m_1v_{1i} + m_2v_{2i} = m_1v_{1f} + m_2v_{2f}}"></div><span class="eq-no">(9.6.2)</span></div>
<ul class="pts">
<li><b class="k">완전 비탄성 충돌 (completely inelastic collision)</b>은 두 물체가 붙어 <span data-tex="V = \dfrac{m_1}{m_1 + m_2}v_{1i}"></span> (9.6.4)로 움직이고 운동에너지는 보존되지 않는다.</li>
<li><b class="k">탄성 충돌 (elastic collision)</b>은 운동에너지도 보존되어 <span data-tex="v_{1f} = \dfrac{m_1 - m_2}{m_1 + m_2}v_{1i}"></span>, <span data-tex="v_{2f} = \dfrac{2m_1}{m_1 + m_2}v_{1i}"></span> (9.7.6, 9.7.7)이다. 질량이 같으면 두 물체가 속도를 맞바꾼다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f3_collision.svg" alt="충돌 전 정지한 m2로 다가가는 m1, 완전 비탄성 충돌 뒤 함께 움직이는 두 물체, 탄성 충돌 뒤 되튀는 m1과 앞으로 가는 m2"></div>
