<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외적 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
<style>
.bar input[type=radio] { accent-color: var(--crimson); width: 16px; height: 16px; margin: 0; }
@media (max-width: 860px) { .page.screen .stagewrap { height: 440px; } .page.screen svg.graphs { height: 380px; } }
</style>
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="cross.html">← 외적</a>
<h1>외적 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{c_z = ab\sin\phi}"></div></div>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="group" aria-label="xy 평면 위의 두 벡터 a, b와 z축 방향의 c, a에서 b로 작은 각을 따라 그린 오른손 규칙 호, a와 b의 머리를 바닥 위에서 끌어 바꿈, 빈 곳을 끌면 시점이 돎" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="cname"></div><div class="read" id="czval"></div></div></div>
<div class="bar">
<button id="reset" aria-label="처음으로">↺</button>
<label for="ab"><input type="radio" name="order" id="ab" value="ab" checked> <span data-tex="\vec a\times\vec b"></span></label>
<label for="ba"><input type="radio" name="order" id="ba" value="ba"> <span data-tex="\vec b\times\vec a"></span></label>
<label for="a">크기 <span data-tex="a"></span> <input type="range" id="a" min="0.5" max="1.5" step="0.1" value="1.5"> <span class="read" id="aval"></span></label>
<label for="b">크기 <span data-tex="b"></span> <input type="range" id="b" min="0.5" max="1.5" step="0.1" value="1.2"> <span class="read" id="bval"></span></label>
<label for="phi"><span><span data-tex="\vec a"></span>에서 <span data-tex="\vec b"></span>로 잰 각 <span data-tex="\phi"></span></span> <input type="range" id="phi" min="0" max="360" step="1" value="70"> <span class="read" id="phival"></span></label>
</div>
<svg id="graphs" class="graphs" role="img" aria-label="지금의 a, b와 곱 순서로 그린 c_z 그래프(ϕ 0–360°)와 지금 값"></svg>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="cross.js"></script>
</body>
</html>
