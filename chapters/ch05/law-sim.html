<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec F_{\text{net}} = m\vec a}"></div></div>
<div class="sim" id="sim">

<label for="m">질량 <span data-tex="m"></span> <input type="range" id="m" min="1" max="10" step="0.5" value="2"> <span class="read" id="mval"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
<p class="read" id="read"></p>
