<head>
<meta charset="utf-8">

<title>수직항력 시뮬레이션 · 서강대 일반물리</title>

<body>
<div class="page wide">
<a class="back" href="normal.html">← 수직항력</a>
<h1>수직항력 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{F_N = m(g + a_y)}"></div></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 620 480" role="img" aria-label="엘리베이터 바닥 저울 위 물체에 작용하는 수직항력과 중력, 엘리베이터 가속도" style="touch-action:none"></svg>
<div class="row">
<label for="ay">엘리베이터 가속도 <span data-tex="a_y"></span> <input type="range" id="ay" min="-9.8" max="9.8" step="0.2" value="0"> <span class="read" id="ayval"></span></label>
<label for="m">질량 <span data-tex="m"></span> <input type="range" id="m" min="10" max="100" step="5" value="60"> <span class="read" id="mval"></span></label>
</div>
<p class="read" id="read"></p>
</div>
<p class="next"><a href="third.html">다음 → 뉴턴의 제3법칙</a></p>
</div>
