<h1>수직항력 (normal force)</h1>
<div class="cols">
<div>
<p>물체가 면을 누르면 면은 물체를 면에 수직으로 밀어낸다. 이 힘이 <b class="k">수직항력 (normal force)</b> <span data-tex="\vec F_N"></span>이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{F_N = m(g + a_y)}"></div><span class="eq-no">(5.2.6)</span></div>
<ul class="pts">
<li><span data-tex="a_y"></span>는 탁자와 블록이 함께 갖는 위 방향 가속도다.</li>
<li>가속하지 않으면 <span data-tex="F_N = mg"></span>이다 (5.2.7).</li>
<li>엘리베이터 안 저울은 수직항력을 잰다. 가속하는 기준틀에서 잰 눈금은 <b class="k">겉보기 무게 (apparent weight)</b>다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_normal.svg" alt="위 방향 가속도 a_y로 움직이는 탁자 위 블록에 작용하는 수직항력 F_N과 중력 F_g"></div>
</div>
