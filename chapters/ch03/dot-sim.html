<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내적 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
</head>
<body>
<div class="page wide">
<a class="back" href="dot.html">← 내적</a>
<h1>내적 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec a\cdot\vec b = ab\cos\phi}"></div></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 640 330" role="img" aria-label="사이각 ϕ인 두 벡터와 b 방향으로의 a의 성분" style="touch-action:none"></svg>
<div class="row">
<label for="a">크기 <span data-tex="a"></span> <input type="range" id="a" min="1" max="8" step="0.5" value="5"> <span class="read" id="aval"></span></label>
<label for="b">크기 <span data-tex="b"></span> <input type="range" id="b" min="1" max="8" step="0.5" value="8"> <span class="read" id="bval"></span></label>
<label for="phi">사이각 <span data-tex="\phi"></span> <input type="range" id="phi" min="0" max="180" step="1" value="50"> <span class="read" id="phival"></span></label>
</div>
<p class="read" id="read"></p>
</div>
<p class="next"><a href="cross.html">다음 → 외적</a></p>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="dot.js"></script>
</body>
</html>
