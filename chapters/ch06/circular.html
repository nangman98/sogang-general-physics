<h1>등속 원운동의 힘 (uniform circular motion)</h1>
<div class="cols">
<div>
<p>반지름 <span data-tex="R"></span>인 원을 일정한 속력 <span data-tex="v"></span>로 돌려면 원의 중심을 향하는 알짜힘이 있어야 한다. 이 힘을 <b class="k">구심력 (centripetal force)</b>이라 한다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{F = \dfrac{mv^2}{R}}"></div><span class="eq-no">(6.3.2)</span></div>
<ul class="pts">
<li>가속도 <span data-tex="a = v^2/R"></span> (6.3.1)과 힘은 둘 다 원의 중심을 향한다.</li>
<li>구심력은 새로운 종류의 힘이 아니다. 줄의 장력, 중력, 마찰력처럼 이미 있는 힘이 그 방향으로 작용하는 것을 부르는 이름이다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f3_circular_force.svg" alt="마찰 없는 수평면에서 반지름 R인 원을 도는 퍽을 위에서 본 그림, 중심을 향하는 장력 T와 접선 방향 속도 v"></div>
</div>
