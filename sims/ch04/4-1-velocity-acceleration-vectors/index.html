<title>4.2–4.3 평균·순간 속도와 가속도 · 서강대 일반물리 시뮬레이션</title>
<link rel="stylesheet" href="../../../vendor/katex/katex.min.css">

<style>
/* Screen-only pieces (core candidates): the Δt → 0 table and the hidden-until-answered readout. */
.activity-panel .lead { margin: 2px 0 8px; }
.activity-panel .shrink table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
.activity-panel .shrink th { font-weight: 600; color: var(--ink-2); text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.activity-panel .shrink td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line-2); }
.activity-panel .shrink th:first-child, .activity-panel .shrink td:first-child { text-align: left; }
.activity-panel .shrink tr.limit td { font-weight: 650; color: var(--ink); }
.activity-panel .shrink small { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.activity-panel .shrink .katex { font-size: 1em; }
.reading .wait { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.world-label.tag .katex { font-size: 1.05em; }
.equations .eq:not(.live) { line-height: 1.4; padding: 4px 0; align-items: center; }   /* room for display fractions (core candidate) */
</style>
<script type="importmap">{ "imports": { "three": "../../../vendor/three/three.module.js" } }</script>

<noscript>이 시뮬레이션은 JavaScript와 WebGL이 필요하다.</noscript>
<script type="module">
import { mountScreen } from '../../../core/app.js';
import * as model from './model.js';
import { view } from './view.js';
import { spec } from './spec.js';
mountScreen({ spec, model, view }).catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre>' + e.stack + '</pre>'); window.screenError = String(e.stack || e); });
