<h1>자유 낙하 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="v = v_0 - gt \qquad \textcolor{#840025}{y - y_0 = v_0 t - \tfrac{1}{2} g t^2}"></div><span class="eq-no"><span data-tex="y_0 = 0,\ g = 9.8\ \mathrm{m/s^2}"></span></span></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 640 360" role="img" aria-label="위로 던진 공의 높이와 v-t 그래프"></svg>
<div class="row">
<label for="v0">처음 속도 <span data-tex="v_0"></span> <input type="range" id="v0" min="0" max="25" step="1" value="15"> <span class="read" id="v0val"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
<p class="read" id="read"></p>
</div>
