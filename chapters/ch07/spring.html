<h1>보존력 (conservative force)</h1>
<div class="cols">
<div>
<p>닫힌 경로를 한 바퀴 도는 입자에 한 알짜 일이 0인 힘을 <b class="k">보존력 (conservative force)</b>이라 한다 (8.1절). 훅의 법칙 <span data-tex="F_x = -kx"></span> (7.4.2)를 따르는 용수철 힘이 그 예다. 블록이 <span data-tex="x_i"></span>에서 <span data-tex="x_f"></span>로 갈 때 용수철 힘이 하는 일은 다음과 같다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{W_s = \tfrac12 kx_i^2 - \tfrac12 kx_f^2}"></div><span class="eq-no">(7.4.6)</span></div>
<ul class="pts">
<li><span data-tex="W_s"></span>는 처음과 나중 위치에만 따른다. 블록이 처음 자리로 돌아오면 (<span data-tex="x_f = x_i"></span>) 용수철 힘이 한 알짜 일은 0이다.</li>
<li>용수철 힘과 중력은 보존력이고 운동 마찰력은 보존력이 아니다 (8.1절).</li>
</ul>
</div>
