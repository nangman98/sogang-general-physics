<h1>충격량 (impulse)</h1>
<div class="cols">
<div>
<p><b class="k">선운동량 (linear momentum)</b>은 <span data-tex="\vec p = m\vec v"></span> (9.3.1)이다. 충돌하는 동안 힘 <span data-tex="\vec F(t)"></span>를 시간으로 적분한 값이 <b class="k">충격량 (impulse)</b> <span data-tex="\vec J"></span> (9.4.3)다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\Delta\vec p = \vec J}"></div><span class="eq-no">(9.4.4)</span></div>
<ul class="pts">
<li>충격량의 크기는 <span data-tex="F"></span>–<span data-tex="t"></span> 그래프 아래 넓이다.</li>
<li>평균 힘으로 쓰면 <span data-tex="J = F_{avg}\Delta t"></span> (9.4.8)다. 같은 <span data-tex="J"></span>라도 충돌 시간 <span data-tex="\Delta t"></span>가 길면 <span data-tex="F_{avg}"></span>가 작다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_impulse.svg" alt="충돌 동안의 힘 F(t) 곡선과 그 아래 넓이 J, 같은 넓이를 가진 높이 F_avg, 너비 Δt인 직사각형"></div>
</div>
</div>
