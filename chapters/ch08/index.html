<h1>역학적 에너지 보존 (conservation of mechanical energy)</h1>
<div class="cols">
<div>
<p><b class="k">역학적 에너지 (mechanical energy)</b>는 <span data-tex="E_{mec} = K + U"></span> (8.2.1)다. <b class="k">퍼텐셜 에너지 (potential energy)</b>는 중력에서 <span data-tex="U = mgy"></span> (8.1.9), 용수철에서 <span data-tex="U = \tfrac12 kx^2"></span> (8.1.11)다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{K_2 + U_2 = K_1 + U_1}"></div><span class="eq-no">(8.2.6)</span></div>
<ul class="pts">
<li>외력이 에너지를 바꾸지 않는 고립계에서 보존력만 일을 하면 성립한다.</li>
<li>한쪽이 늘어난 만큼 다른 쪽이 줄어든다 (<span data-tex="\Delta K = -\Delta U"></span>, 8.2.4).</li>
</ul>
</div>
