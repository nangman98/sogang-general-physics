<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장력 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
<style>
@media (max-width: 860px) { .page.screen .stagewrap { height: 440px; } }
</style>
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="pulley.html">← 장력</a>
<h1>장력 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{T = \frac{M}{M + m}\,mg}"></div><span class="eq-no"><span data-tex="g = 9.8\ \mathrm{m/s^2}"></span></span></div>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="img" aria-label="마찰 없는 탁자 위 나무 상자 M과 탁자 끝 도르래를 지나는 줄에 매달린 상자 m, 줄이 두 상자를 당기는 장력 T와 매달린 상자의 중력 mg, 두 상자의 가속도 a" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="Tval"></div><div class="read" id="gval"></div><div class="read" id="aval"></div></div></div>
<div class="bar">
<button id="play" aria-label="재생">▶</button><button id="reset" aria-label="처음으로">↺</button>
<label for="speed">배속 <select id="speed"><option value="0.1">0.1×</option><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select></label>
<span class="read" id="tval"></span>
<label for="M">탁자 위 상자 <span data-tex="M"></span> <input type="range" id="M" min="0.5" max="5" step="0.1" value="3.3"> <span class="read" id="Mval"></span></label>
<label for="m">매달린 상자 <span data-tex="m"></span> <input type="range" id="m" min="0.5" max="5" step="0.1" value="2.1"> <span class="read" id="mval"></span></label>
</div>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="pulley.js"></script>
</body>
</html>
