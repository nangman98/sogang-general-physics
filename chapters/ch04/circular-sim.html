<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>등속 원운동 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="circular.html">← 등속 원운동</a>
<h1>등속 원운동 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{a = \frac{v^2}{r}}"></div></div>
<p class="next"><a href="relative.html">다음 → 상대 운동</a></p>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="img" aria-label="위에서 본 원형 트랙을 반시계 방향으로 도는 자동차와 접선 방향 속도 v, 중심을 향한 가속도 a, 반지름 r" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="aval"></div><div class="read" id="Tval"></div></div></div>
<div class="bar">
<button id="play" aria-label="재생">▶</button><button id="reset" aria-label="처음으로">↺</button>
<label for="speed">배속 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<span class="read" id="tval"></span>
<label for="v">속력 <span data-tex="v"></span> <input type="range" id="v" min="1" max="6" step="0.5" value="5" style="width:120px"> <span class="read" id="vval"></span></label>
<label for="r">반지름 <span data-tex="r"></span> <input type="range" id="r" min="2.5" max="5" step="0.5" value="3" style="width:120px"> <span class="read" id="rval"></span></label>
<label for="comp"><input type="checkbox" id="comp"> 속도 성분</label>
</div>
<svg id="graphs" class="graphs" role="img" aria-label="같은 시간축의 v_x-t, v_y-t 그래프와 주기 T 표시"></svg>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="circular.js"></script>
</body>
</html>
