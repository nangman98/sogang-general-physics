<h1>등각가속도 회전 (rotation with constant angular acceleration)</h1>
<div class="cols">
<div>
<p><b class="k">각속도 (angular velocity)</b>는 <span data-tex="\omega = d\theta/dt"></span> (10.1.6), <b class="k">각가속도 (angular acceleration)</b>는 <span data-tex="\alpha = d\omega/dt"></span> (10.1.8)다. 반시계 방향 회전이 양(+)이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\theta - \theta_0 = \omega_0 t + \tfrac12\alpha t^2}"></div><span class="eq-no">(10.2.2)</span></div>
<ul class="pts">
<li>각속도는 <span data-tex="\omega = \omega_0 + \alpha t"></span> (10.2.1)다. 2장 등가속도 식에서 <span data-tex="x"></span>, <span data-tex="v"></span>, <span data-tex="a"></span>를 <span data-tex="\theta"></span>, <span data-tex="\omega"></span>, <span data-tex="\alpha"></span>로 바꾼 꼴이다.</li>
<li>각은 라디안으로 잰다 (<span data-tex="1\ \mathrm{rev} = 360^\circ = 2\pi\ \mathrm{rad}"></span>).</li>
</ul>
</div>
<div class="fig"><img src="fig/f1_rotation.svg" alt="기준선이 각 θ만큼 돌아간 원판과 반시계 방향 각속도 ω, θ-t 포물선과 ω-t 직선"></div>
</div>
