<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내적 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
<style>
@media (max-width: 860px) { .page.screen .stagewrap { height: 480px; } .page.screen svg.graphs { height: 380px; } }
</style>
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="dot.html">← 내적</a>
<h1>내적 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec a\cdot\vec b = ab\cos\phi}"></div></div>
<p class="next"><a href="cross.html">다음 → 외적</a></p>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="group" aria-label="원점에서 그린 두 벡터 a, b와 사이각 ϕ, b 방향으로의 a의 성분 a cos ϕ 막대, 두 화살표 끝을 끌어 바꿈" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="compval"></div><div class="read" id="dotval"></div></div></div>
<div class="bar">
<button id="reset" aria-label="처음으로">↺</button>
<label for="a">크기 <span data-tex="a"></span> <input type="range" id="a" min="0.5" max="5" step="0.5" value="3"> <span class="read" id="aval"></span></label>
<label for="b">크기 <span data-tex="b"></span> <input type="range" id="b" min="0.5" max="5" step="0.5" value="4"> <span class="read" id="bval"></span></label>
<label for="phi">사이각 <span data-tex="\phi"></span> <input type="range" id="phi" min="0" max="180" step="1" value="50"> <span class="read" id="phival"></span></label>
</div>
<svg id="graphs" class="graphs" role="img" aria-label="지금의 a, b로 그린 a·b = ab cos ϕ 그래프(ϕ 0–180°)와 지금 값"></svg>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="dot.js"></script>
</body>
</html>
