<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>등가속도 운동 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
</head>
<body>
<div class="page wide">
<a class="back" href="index.html">← 등가속도 운동</a>
<h1>등가속도 운동 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{x - x_0 = v_0 t + \tfrac{1}{2} a t^2}"></div><span class="eq-no"><span data-tex="x_0 = 0"></span></span></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 900 460" role="img" aria-label="x축 위를 움직이는 물체와 속도·가속도 화살표, x-t, v-t, a-t 그래프"></svg>
<div class="row">
<label for="v0">처음 속도 <span data-tex="v_0"></span> <input type="range" id="v0" min="-10" max="10" step="1" value="8"> <span class="read" id="v0val"></span></label>
<label for="a">가속도 <span data-tex="a"></span> <input type="range" id="a" min="-5" max="5" step="0.5" value="-4"> <span class="read" id="aval"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
<p class="read" id="read"></p>
</div>
<p class="next"><a href="free-fall.html">다음 → 자유 낙하</a></p>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="accel.js"></script>
</body>
</html>
