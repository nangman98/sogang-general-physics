<h1>질량 중심 (center of mass)</h1>
<div class="cols">
<div>
<p>입자계의 <b class="k">질량 중심 (center of mass)</b>은 계의 질량이 모두 그곳에 모여 있고 외력이 모두 그곳에 작용하는 것처럼 움직이는 점이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{x_{com} = \dfrac{m_1x_1 + m_2x_2}{m_1 + m_2}}"></div><span class="eq-no">(9.1.1)</span></div>
<ul class="pts">
<li>입자가 <span data-tex="n"></span>개이면 <span data-tex="x_{com} = \tfrac{1}{M}\sum m_i x_i"></span>이고 <span data-tex="y"></span>, <span data-tex="z"></span>도 같은 꼴이다 (<span data-tex="M"></span>은 전체 질량).</li>
<li>외력의 알짜힘이 질량 중심을 가속한다 (<span data-tex="\vec F_{net} = M\vec a_{com}"></span>, 9.2.1). 터진 불꽃 조각들의 질량 중심도 원래 포물선을 따라간다.</li>
</ul>
</div>
