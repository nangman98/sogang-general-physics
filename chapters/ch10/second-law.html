<h1>회전의 제2법칙 (Newton’s second law for rotation)</h1>
<div class="cols">
<div>
<p><b class="k">회전 관성 (rotational inertia)</b> <span data-tex="I = \sum m_i r_i^2"></span> (10.4.3)은 물체의 질량이 회전축 둘레에 어떻게 퍼져 있는지를 담는다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\tau_{net} = I\alpha}"></div><span class="eq-no">(10.7.1)</span></div>
<ul class="pts">
<li>같은 돌림힘이라도 질량이 축에서 멀리 있으면 회전 관성이 커서 각가속도가 작다.</li>
<li>회전 운동에너지는 <span data-tex="K = \tfrac12 I\omega^2"></span> (10.4.4)다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f4_inertia.svg" alt="같은 두 질량을 축 가까이 둔 막대(작은 I, 큰 α)와 멀리 둔 막대(큰 I, 작은 α), 같은 돌림힘 τ"></div>
</div>
