<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수직항력 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
<style>
.bar label .read { display: inline-block; min-width: 4.6em; }
@media (max-width: 860px) { .page.screen .stagewrap { height: 400px; } .page.screen svg.graphs { height: 340px; } }
</style>
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="normal.html">← 수직항력</a>
<h1>수직항력 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{F_N = m(g + a_y)}"></div><span class="eq-no"><span data-tex="g = 9.8\ \mathrm{m/s^2}"></span></span></div>
<p class="next"><a href="pulley.html">다음 → 장력</a></p>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="img" aria-label="건물 안을 오르내리는 엘리베이터, 그 안의 저울 위에 선 사람, 사람의 자유물체도에 그린 수직항력 F_N과 중력 F_g, 엘리베이터의 가속도 a_y와 속도 v_y 화살표" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="Nval"></div><div class="read" id="gval"></div><div class="read" id="vval"></div></div></div>
<div class="bar">
<button id="play" aria-label="재생">▶</button><button id="reset" aria-label="처음으로">↺</button>
<label for="speed">배속 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<span class="read" id="tval"></span>
<label for="ay">가속도 <span data-tex="a_y"></span> <input type="range" id="ay" min="-9.8" max="9.8" step="0.2" value="2"> <span class="read" id="ayval"></span></label>
<label for="m">질량 <span data-tex="m"></span> <input type="range" id="m" min="30" max="100" step="5" value="60"> <span class="read" id="mval"></span></label>
</div>
<svg id="graphs" class="graphs" role="img" aria-label="같은 시간축의 v_y-t, F_N-t 그래프와 mg 높이의 점선"></svg>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="elevator.js"></script>
</body>
</html>
