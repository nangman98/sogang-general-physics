<h1>뉴턴의 제3법칙 (Newton's third law)</h1>
<div class="cols">
<div>
<p><b class="k">제3법칙</b> 두 물체가 상호 작용할 때 서로에게 주는 힘은 늘 크기가 같고 방향이 반대다. <span data-tex="\vec F_{BC}"></span>는 물체 B에 물체 C가 주는 힘이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec F_{BC} = -\vec F_{CB}}"></div><span class="eq-no">(5.3.1)</span></div>
<ul class="pts">
<li>두 힘을 <b class="k">짝힘 (third-law force pair)</b>이라 한다. 짝힘은 서로 다른 두 물체에 작용하므로 한 물체의 자유물체도에서 서로 상쇄되지 않는다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f3_third.svg" alt="마찰 없는 바닥에서 힘 F로 밀리는 맞닿은 두 상자 A, B와 서로 주고받는 힘 F_AB, F_BA"></div>
