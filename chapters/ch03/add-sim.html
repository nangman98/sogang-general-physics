<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>벡터의 합성 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
<style>
.bar input[type=radio] { accent-color: var(--crimson); width: 16px; height: 16px; margin: 0; }
@media (max-width: 860px) { .page.screen .stagewrap { height: 520px; } }
</style>
</head>
<body>
<div class="page screen">
<div class="sim-head">
<a class="back" href="index.html">← 벡터와 벡터의 합성</a>
<h1>벡터의 합성 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{r_x = a_x + b_x \qquad r_y = a_y + b_y}"></div></div>
<p class="next"><a href="dot.html">다음 → 내적</a></p>
</div>
<div class="stagewrap"><svg id="scene" class="scene" role="group" aria-label="격자 위에서 a의 머리에 b의 꼬리를 이은 합 r, 두 화살표 끝을 끌어 바꿈, 축 옆에 a_x와 b_x를 이은 화살표와 r_x 화살표" style="touch-action:none"></svg>
<div class="readout"><div class="read" id="rx"></div><div class="read" id="ry"></div><div class="read" id="rmag"></div></div></div>
<div class="bar">
<button id="reset" aria-label="처음으로">↺</button>
<label for="op-add"><input type="radio" name="op" id="op-add" value="add" checked> <span data-tex="\vec a + \vec b"></span></label>
<label for="op-sub"><input type="radio" name="op" id="op-sub" value="sub"> <span data-tex="\vec a - \vec b"></span></label>
<label for="comp"><input type="checkbox" id="comp" checked> 성분</label>
<label for="swap"><input type="checkbox" id="swap"> 순서 바꾸기</label>
<span class="out"><span class="read" id="aval"></span><span class="read" id="bval"></span></span>
</div>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="addition.js"></script>
</body>
</html>
