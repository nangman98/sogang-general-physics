<h1>용수철 힘이 하는 일 (work done by a spring force)</h1>
<div class="cols">
<div>
<p>용수철 힘은 <b class="k">훅의 법칙 (Hooke’s law)</b> <span data-tex="F_x = -kx"></span> (7.4.2)를 따라 위치마다 크기가 달라진다. 이런 힘이 하는 일은 <span data-tex="F"></span>–<span data-tex="x"></span> 그래프 아래 넓이다 (7.5.4).</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{W_s = \tfrac12 kx_i^2 - \tfrac12 kx_f^2}"></div><span class="eq-no">(7.4.6)</span></div>
<ul class="pts">
<li>용수철 힘의 방향은 늘 용수철 끝의 변위와 반대다 (식의 음의 부호).</li>
<li>블록이 이완 위치 (<span data-tex="x = 0"></span>)에 더 가까워지면 <span data-tex="W_s"></span>는 양수, 더 멀어지면 음수, 같은 거리면 0이다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_spring.svg" alt="이완, 늘어남, 줄어듦 상태의 용수철과 블록, 변위 x와 반대 방향의 용수철 힘 F_x"></div>
