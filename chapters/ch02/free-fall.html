<h1>자유 낙하 (free fall)</h1>
<p>공기를 무시하면 물체는 올라갈 때나 내려갈 때나 아래 방향으로 크기 <span data-tex="g"></span>인 일정한 가속도를 받는다. <span data-tex="y"></span>축을 위로 잡으면 <span data-tex="a = -g"></span>다.</p>

<div class="eq"><div class="eq-tex" data-tex="a = -g = -9.8\ \mathrm{m/s^2}"></div></div>
<div class="eq"><div class="eq-tex" data-tex="v = v_0 - gt"></div><span class="eq-no">(2.4.1에서 <span data-tex="a = -g"></span>)</span></div>
<div class="eq"><div class="eq-tex" data-tex="y - y_0 = v_0 t - \tfrac{1}{2} g t^2"></div><span class="eq-no">(2.4.5에서 <span data-tex="a = -g"></span>)</span></div>
<ul class="pts">
<li><span data-tex="v"></span>–<span data-tex="t"></span> 그래프는 기울기가 <span data-tex="-g"></span>인 직선이다.</li>
<li>가장 높은 곳에서 <span data-tex="v = 0"></span>이지만 가속도는 그대로 <span data-tex="-g"></span>다.</li>
<li><span data-tex="g"></span> 자체는 양수 9.8 m/s²다.</li>
</ul>

<div class="fig"><img src="fig/f6_free_fall.svg" alt="정지 상태에서 떨어지는 물체의 t = 0, 1, 2, 3 s 위치와 속도 화살표, 48 m 아래 수면"></div>
<p>교재 예제 2.5.1에서는 정지 상태에서 떨어진 물체가 3.1 s 만에 48 m 아래 수면에 <span data-tex="v \approx -31\ \mathrm{m/s}"></span>로 닿는다.</p>

<div class="sim" id="sim">
<svg id="view" viewBox="0 0 640 360" role="img" aria-label="위로 던진 공의 높이와 v-t 그래프"></svg>
<div class="row">
<label for="v0">처음 속도 <span data-tex="v_0"></span> <input type="range" id="v0" min="0" max="25" step="1" value="15"> <span class="read" id="v0val"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
