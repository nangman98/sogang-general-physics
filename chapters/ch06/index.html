<h1>마찰력 (friction)</h1>
<div class="cols">
<div>
<p>면을 따라 미는 힘을 받으면 면은 미끄러짐을 막는 방향으로 마찰력을 준다. 물체가 멈춰 있으면 <b class="k">정지 마찰력 (static frictional force)</b> <span data-tex="f_s"></span>, 미끄러지면 <b class="k">운동 마찰력 (kinetic frictional force)</b> <span data-tex="f_k"></span>다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{f_{s,\max} = \mu_s F_N}"></div><span class="eq-no">(6.1.1)</span></div>
<ul class="pts">
<li>멈춰 있는 동안 <span data-tex="f_s"></span>는 미는 힘의 면 방향 성분과 크기가 같고 그 성분을 따라 커진다.</li>
<li>그 성분이 <span data-tex="f_{s,\max}"></span>를 넘으면 미끄러지기 시작하고 마찰력은 일정한 값 <span data-tex="f_k = \mu_k F_N"></span> (6.1.2)로 빠르게 줄어든다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f1_friction.svg" alt="바닥 위 상자를 미는 힘 F와 반대 방향의 마찰력 f, 미는 힘을 키울 때 마찰력이 f_s,max까지 커졌다가 미끄러지면 f_k로 줄어드는 그래프"></div>
</div>
</div>
