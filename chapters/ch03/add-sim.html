<div class="page wide">

<h1>벡터의 합성 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{r_x = a_x + b_x \qquad r_y = a_y + b_y}"></div></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 600 600" role="img" aria-label="격자 위의 두 벡터 a, b와 머리-꼬리 합 r" style="touch-action:none"></svg>
<div class="row">
<button data-mode="a+b"><span data-tex="\vec a + \vec b"></span></button><button data-mode="b+a"><span data-tex="\vec b + \vec a"></span></button><button data-mode="a-b"><span data-tex="\vec a - \vec b"></span></button> <button id="reset">처음으로</button> <span>동그라미를 끌어 <span data-tex="\vec a"></span>, <span data-tex="\vec b"></span>를 바꾼다</span>
</div>
<p class="read" id="read"></p>
</div>
