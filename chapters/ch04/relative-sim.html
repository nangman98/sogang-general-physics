<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상대 운동 시뮬레이션 · 서강대 일반물리</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../core/chapter.css">
</head>
<body>
<div class="page wide">
<a class="back" href="relative.html">← 상대 운동</a>
<h1>상대 운동 시뮬레이션</h1>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\vec v_{PA} = \vec v_{PB} + \vec v_{BA}}"></div></div>
<div class="sim" id="sim">
<svg id="view" viewBox="0 0 900 440" role="img" aria-label="강을 건너는 배와 세 속도 화살표" style="touch-action:none"></svg>
<div class="row">
<label for="vPB">강물에서 본 배의 속력 <span data-tex="v_{PB}"></span> <input type="range" id="vPB" min="2" max="6" step="0.5" value="3"> <span class="read" id="vPBval"></span></label>
<label for="vBA">강가에서 본 강물의 속력 <span data-tex="v_{BA}"></span> <input type="range" id="vBA" min="0" max="3" step="0.5" value="1.5"> <span class="read" id="vBAval"></span></label>
<label for="th">뱃머리 각 (상류 쪽 +) <input type="range" id="th" min="-60" max="60" step="1" value="0"> <span class="read" id="thval"></span></label>
<button class="main" id="play">재생</button><button id="reset">처음으로</button>
</div>
<p class="read" id="read"></p>
</div>
</div>
<script type="module" src="../../core/chapter.js"></script>
<script type="module" src="boat.js"></script>
</body>
</html>
