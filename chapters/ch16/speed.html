<h1>줄의 파동 속력 (wave speed on a stretched string)</h1>
<div class="cols">
<div>
<p>파동 속력은 매질의 성질로 정해진다. 줄에서는 <b class="k">장력 (tension)</b> <span data-tex="\tau"></span>와 <b class="k">선밀도 (linear density)</b> <span data-tex="\mu = m/l"></span>이 그 성질이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{v = \sqrt{\tau/\mu}}"></div><span class="eq-no">(16.2.5)</span></div>
<ul class="pts">
<li>팽팽한 이상적인 줄의 파동 속력은 장력과 선밀도에만 달려 있고 파동의 진동수와는 상관없다.</li>
<li>진동수는 파동을 만드는 쪽이 정하고 파장은 <span data-tex="\lambda = v/f"></span> (16.1.13)로 정해진다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_string_speed.svg" alt="펄스와 함께 움직이는 틀에서 본 대칭 펄스, 꼭대기 줄 요소 Δl의 두 끝을 당기는 장력 τ와 반지름 R인 원의 중심 O를 향하는 힘 F, 왼쪽으로 움직이는 줄의 속도 v"></div>
</div>
