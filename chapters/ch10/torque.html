<h1>돌림힘 (torque)</h1>
<div class="cols">
<div>
<p>회전축에서 <span data-tex="r"></span>만큼 떨어진 곳에 힘 <span data-tex="F"></span>가 각 <span data-tex="\phi"></span>로 작용하면 물체를 돌리려는 작용인 <b class="k">돌림힘 (torque)</b>이 생긴다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{\tau = rF\sin\phi}"></div><span class="eq-no">(10.6.1)</span></div>
<ul class="pts">
<li>같은 값을 <span data-tex="\tau = rF_t = r_\perp F"></span> (10.6.2, 10.6.3)로도 쓴다. <span data-tex="r_\perp"></span>는 회전축에서 힘의 작용선까지 거리 (moment arm)다.</li>
<li>정지한 물체를 반시계 방향으로 돌리려 하면 양(+), 시계 방향이면 음(−)이다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f3_torque.svg" alt="축 O에서 거리 r인 점에 각 ϕ로 작용하는 힘 F, 접선 성분 F_t, 축에서 힘의 작용선까지 거리 r⊥"></div>
</div>
