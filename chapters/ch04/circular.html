<h1>등속 원운동 (uniform circular motion)</h1>
<div class="cols">
<div>
<p>반지름 <span data-tex="r"></span>인 원이나 원호를 일정한 속력 <span data-tex="v"></span>로 도는 운동이다. 속력은 변하지 않아도 속도의 방향이 계속 바뀌므로 가속도가 있다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{a = \frac{v^2}{r}}"></div><span class="eq-no">(4.5.1)</span></div>
<ul class="pts">
<li>속도 <span data-tex="\vec v"></span>는 늘 원의 접선 방향(운동 방향)이다.</li>
<li>가속도 <span data-tex="\vec a"></span>는 늘 원의 중심을 향해서 <b class="k">구심 가속도 (centripetal acceleration)</b>라 한다.</li>
<li><b class="k">주기 (period)</b> <span data-tex="T = \frac{2\pi r}{v}"></span> (4.5.2)는 한 바퀴를 도는 데 걸리는 시간이다.</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_circular.svg" alt="원을 도는 물체의 세 위치에서 원의 접선 방향 속도 v와 중심 방향 가속도 a"></div>
