<h1>벡터와 벡터의 합성 (vectors, adding vectors)</h1>
<div class="cols">
<div>
<p><b class="k">벡터 (vector)</b>는 크기와 방향을 함께 가진 양이다. 두 벡터는 앞 벡터의 머리에 뒤 벡터의 꼬리를 이어 더한다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{r_x = a_x + b_x \qquad r_y = a_y + b_y}"></div><span class="eq-no">(3.2.4), (3.2.5)</span></div>
<ul class="pts">
<li><b class="k">성분 (component)</b>은 벡터를 각 축에 투영한 값이다. 그림으로 이은 합과 성분끼리 더한 합은 같은 벡터다.</li>
<li>순서를 바꿔도 합은 같다 (<span data-tex="\vec a + \vec b = \vec b + \vec a"></span>) (3.1.2).</li>
<li>차 <span data-tex="\vec a - \vec b"></span>는 <span data-tex="\vec a"></span>에 <span data-tex="-\vec b"></span>를 더해 구한다 (3.1.4).</li>
</ul>
</div>
<div class="fig"><img src="fig/f2_head_to_tail.svg" alt="벡터 a의 머리에 벡터 b의 꼬리를 이어 그린 합 r, 점선은 순서를 바꾼 합"></div>
