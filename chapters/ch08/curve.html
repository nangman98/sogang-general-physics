<h1>퍼텐셜 에너지 곡선 (potential energy curve)</h1>
<div class="cols">
<div>
<p>1차원에서 입자에 작용하는 힘은 퍼텐셜 에너지 곡선 <span data-tex="U(x)"></span>의 기울기에 음의 부호를 붙인 값이다.</p>
<div class="eq"><div class="eq-tex" data-tex="\textcolor{#840025}{F(x) = -\dfrac{dU(x)}{dx}}"></div><span class="eq-no">(8.3.2)</span></div>
<ul class="pts">
<li>운동에너지는 <span data-tex="K(x) = E_{mec} - U(x)"></span> (8.3.4)다. <span data-tex="K"></span>는 음수가 될 수 없어서 <span data-tex="U > E_{mec}"></span>인 곳으로는 가지 못한다.</li>
<li><span data-tex="K = 0"></span>인 곳이 <b class="k">되돌이점 (turning point)</b>이다. 기울기가 0인 곳은 평형점이고 곡선의 바닥은 안정 평형, 꼭대기는 불안정 평형이다.</li>
</ul>
</div>
